AWSTemplateFormatVersion: "2010-09-09"
Description: ACM Certificate for nagiyu

Parameters:
  RootDomain:
    Type: String
    Description: The root domain name for the certificate (e.g., example.com)
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*\.[a-zA-Z]{2,}$
    ConstraintDescription: Must be a valid domain name

  SubjectAlternativeNames:
    Type: CommaDelimitedList
    Description: Additional domain names for the certificate (e.g., *.example.com)
    Default: ""

Conditions:
  HasSubjectAlternativeNames: !Not
    - !Equals
      - !Join ["", !Ref SubjectAlternativeNames]
      - ""

Resources:
  NagiyuCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref RootDomain
      SubjectAlternativeNames: !If
        - HasSubjectAlternativeNames
        - !Ref SubjectAlternativeNames
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: nagiyu-acm-certificate
        - Key: Project
          Value: nagiyu

Outputs:
  RecordName:
    Description: DNS validation record name for the ACM certificate
    Value: !GetAtt NagiyuCertificate.DomainValidationOptions.0.ResourceRecord.Name
    Export:
      Name: !Sub "${AWS::StackName}-RecordName"

  RecordType:
    Description: DNS validation record type for the ACM certificate
    Value: !GetAtt NagiyuCertificate.DomainValidationOptions.0.ResourceRecord.Type
    Export:
      Name: !Sub "${AWS::StackName}-RecordType"

  RecordValue:
    Description: DNS validation record value for the ACM certificate
    Value: !GetAtt NagiyuCertificate.DomainValidationOptions.0.ResourceRecord.Value
    Export:
      Name: !Sub "${AWS::StackName}-RecordValue"

  DomainName:
    Description: The domain name for the certificate
    Value: !Ref RootDomain
    Export:
      Name: !Sub "${AWS::StackName}-DomainName"

  CertificateArn:
    Description: ARN of the ACM certificate
    Value: !Ref NagiyuCertificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"
