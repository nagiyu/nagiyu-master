AWSTemplateFormatVersion: "2010-09-09"
Description: ACM Certificate for nagiyu

Parameters:
  RootDomain:
    Type: String
    Description: The root domain name for the certificate (e.g., example.com)
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*\.[a-zA-Z]{2,}$
    ConstraintDescription: Must be a valid domain name

  IncludeRootInSAN:
    Type: String
    Description: Include the root domain in SubjectAlternativeNames (true/false)
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  IncludeWildcard:
    Type: String
    Description: Include wildcard subdomain (*.example.com) in SubjectAlternativeNames (true/false)
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  AdditionalSANs:
    Type: CommaDelimitedList
    Description: Additional domain names for the certificate (optional, comma-separated). Note - only used when IncludeRootInSAN and IncludeWildcard are both false.
    Default: ""

Conditions:
  IncludeRootInSANCondition: !Equals
    - !Ref IncludeRootInSAN
    - "true"

  IncludeWildcardCondition: !Equals
    - !Ref IncludeWildcard
    - "true"

  HasAdditionalSANs: !Not
    - !Equals
      - !Join ["", !Ref AdditionalSANs]
      - ""

  # Combination conditions for building SANs list
  RootAndWildcard: !And
    - !Condition IncludeRootInSANCondition
    - !Condition IncludeWildcardCondition

  RootOnlyNoWildcard: !And
    - !Condition IncludeRootInSANCondition
    - !Not [!Condition IncludeWildcardCondition]

  WildcardOnlyNoRoot: !And
    - !Not [!Condition IncludeRootInSANCondition]
    - !Condition IncludeWildcardCondition

Resources:
  NagiyuCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref RootDomain
      SubjectAlternativeNames: !If
        - RootAndWildcard
        - - !Ref RootDomain
          - !Sub "*.${RootDomain}"
        - !If
          - RootOnlyNoWildcard
          - - !Ref RootDomain
          - !If
            - WildcardOnlyNoRoot
            - - !Sub "*.${RootDomain}"
            - !If
              - HasAdditionalSANs
              - !Ref AdditionalSANs
              - !Ref AWS::NoValue
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: nagiyu-acm-certificate
        - Key: Project
          Value: nagiyu

Outputs:
  DomainName:
    Description: The primary domain name for the certificate
    Value: !Ref RootDomain
    Export:
      Name: !Sub "${AWS::StackName}-DomainName"

  CertificateArn:
    Description: ARN of the ACM certificate
    Value: !Ref NagiyuCertificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"
