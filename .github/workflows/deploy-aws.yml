name: Deploy AWS

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'aws/**'
  workflow_dispatch:

jobs:
  deploy-aws:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Nagiyu VPC
        if: env.ENVIRONMENT == 'production'
        run: |
          aws cloudformation deploy \
            --template-file aws/nagiyu-vpc.yaml \
            --stack-name nagiyu-master-nagiyu-vpc

      - name: Deploy Dev Nagiyu VPC
        if: env.ENVIRONMENT == 'development'
        run: |
          aws cloudformation deploy \
            --template-file aws/dev-nagiyu-vpc.yaml \
            --stack-name nagiyu-master-dev-nagiyu-vpc
